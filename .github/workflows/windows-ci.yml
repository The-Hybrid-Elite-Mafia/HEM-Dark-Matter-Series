name: Windows CI (MSVC, C++23)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build + quality-gate tests (MSVC Release, x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          (Get-CimInstance Win32_Processor).Name

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Quality-gate tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -V 2>&1 | Tee-Object -FilePath test-report.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
